<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'" />
    <title>Almanac</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <img src="../assets/icon.png" alt="" />
      <h1>Can’t reach Almanac</h1>
      <p id="detail">Check your internet connection, or whether the server is up.</p>
      <button class="primary" id="retry" type="button">Try again</button>
      <button id="change" type="button">Change address</button>
      <p class="hint">Alerts carry on in the background and catch up once it’s back.</p>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
