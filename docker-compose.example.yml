services:
  almanac:
    image: ghcr.io/daskaputtja/almanac:latest
    container_name: almanac
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      SILO_URL: https://silo.example.com
      SILO_API_KEY: sa_your_key_here
      ALMANAC_USERNAME: admin
      ALMANAC_PASSWORD: change-me
    volumes:
      - ./almanac-data:/data
